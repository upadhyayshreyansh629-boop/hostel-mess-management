{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Hostel Mess Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'mainapp/css/mess.css' %}">
</head>
<body class="login-page d-flex flex-column">

<div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <div class="card login-card border-0">
            <div class="card-body p-4 p-lg-5">

                <div class="login-brand">MM</div>

                <h3 class="text-center fw-bold mb-1">
                    Hostel Mess Management
                </h3>

                <p class="text-center text-muted mb-4">
                    Secure administrator login
                </p>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter username" autocomplete="username" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Enter password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'student_login' %}" class="small text-decoration-none">Student Login</a>
                </div>

            </div>
        </div>

    </div>
</div>

<footer class="footer">
    <div class="text-center">
        <strong>Hostel Mess Management</strong>
        <div class="footer-sub">Developed by <strong>Shreyansh Upadhyay</strong> · © 2026</div>
    </div>
</footer>

</body>
</html>
